name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The check ends with a production build; on the default branch that build is what gets published.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  # Publish to GitHub Pages. Needs Settings → Pages → Source set to "GitHub Actions".
  deploy:
    needs: check
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
