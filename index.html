<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A free speed reading trainer. Paste any text or open a book and read it one word at a time, at the speed you choose."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Speed Reader</title>
    <script>
      // Apply a saved dark theme before the first paint, so the page never flashes light.
      // Mirrors applyTheme() in src/lib/settings/theme.ts.
      try {
        if (JSON.parse(localStorage.getItem('speed-reader:settings')).theme === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
